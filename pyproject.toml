[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clonephish-detector"
version = "0.1.0"
description = "Detect lookalike domains and cloned login pages (defensive research tool)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shudu Hadi" }]
dependencies = ["beautifulsoup4>=4.12", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clonephish = "clonephish.cli:main"

[tool.setuptools]
packages = ["clonephish"]
