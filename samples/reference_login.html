<!DOCTYPE html>
<!-- Fictional brand used for testing. Not a real bank. -->
<html lang="en">
<head>
  <title>MyBank Online Banking | Sign in</title>
  <link rel="stylesheet" href="/static/css/mybank-main.css">
  <script src="/static/js/login-bundle.js"></script>
</head>
<body>
  <header><img src="/static/img/mybank-logo.svg" alt="MyBank"></header>
  <main>
    <h1>Sign in to Online Banking</h1>
    <p>Welcome back. Enter your username and password to access your accounts.</p>
    <form action="/auth/login" method="post">
      <label for="username">Username</label>
      <input id="username" name="username" type="text">
      <label for="password">Password</label>
      <input id="password" name="password" type="password">
      <input type="hidden" name="csrf_token" value="abc123">
      <button type="submit">Sign in</button>
    </form>
    <p>Never share your one-time PIN with anyone. MyBank will never ask for it by phone or email.</p>
  </main>
  <footer>MyBank Ltd is an authorised financial services provider.</footer>
</body>
</html>
